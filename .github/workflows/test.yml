name: CI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run automated test suite
        run: bun test tests/crawlerClassifier.test.ts tests/privacy.test.ts tests/llmSdk.test.ts tests/correlation.test.ts tests/websiteSdk.test.ts
