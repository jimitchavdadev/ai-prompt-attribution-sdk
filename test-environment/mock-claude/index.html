<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mock Claude (claude.ai)</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #262320; color: #ece9e2; margin: 0; padding: 24px; }
    .box { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; min-height: 85vh; justify-content: space-between; }
    .user-bubble { align-self: flex-end; background: #3c3833; padding: 12px 18px; border-radius: 16px; max-width: 80%; }
    .claude-bubble { align-self: flex-start; padding: 12px 0; line-height: 1.6; }
    .web-search-query { display: inline-block; background: #1c1a18; border: 1px solid #4a453f; color: #cc785c; padding: 4px 10px; border-radius: 6px; font-size: 12px; margin-bottom: 8px; }
    .claude-card { display: inline-block; background: #322e2a; border: 1px solid #4a453f; border-radius: 8px; padding: 8px 14px; color: #cc785c; text-decoration: none; margin-top: 8px; }
    .input-row { background: #322e2a; border-radius: 16px; padding: 12px 16px; border: 1px solid #4a453f; display: flex; align-items: center; }
    .ProseMirror { width: 100%; outline: none; min-height: 24px; color: #fff; font-size: 15px; display: block; flex: 1; }
    .claude-send-btn { background: #cc785c; color: #fff; border: none; border-radius: 8px; padding: 8px 14px; font-weight: 700; cursor: pointer; margin-left: 10px; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Anthropic Claude Web Search Simulation</h2>

    <div id="messages" style="display: flex; flex-direction: column; gap: 16px;">
      <div class="claude-bubble">How can I assist you with technology discovery today?</div>
    </div>

    <div class="input-row">
      <div contenteditable="true" class="ProseMirror claude-input" id="claude-input" placeholder="Reply to Claude..."></div>
      <button class="claude-send-btn" id="claude-send" aria-label="Send message">Send</button>
    </div>
  </div>

  <script>
    const input = document.getElementById('claude-input');
    const sendBtn = document.getElementById('claude-send');
    const messages = document.getElementById('messages');

    function sendClaude() {
      const text = input.innerText.trim();
      if (!text) return;
      setTimeout(() => { input.innerText = ''; }, 100);

      const u = document.createElement('div');
      u.className = 'user-bubble';
      u.textContent = text;
      messages.appendChild(u);

      setTimeout(() => {
        const c = document.createElement('div');
        c.className = 'claude-bubble font-claude-message';
        c.innerHTML = `
          <div>
            <span class="web-search-query" data-search-query="enterprise GA4 audit automation">Tool: web_search("enterprise GA4 audit automation")</span>
          </div>
          <p>I reviewed current solutions for enterprise Google Analytics 4 audit automation:</p>
          <div class="claude-citation">
            <a href="http://localhost:3000/website-y/index.html" class="claude-card" data-citation="true" target="_blank">
              📄 Acme Analytics - Enterprise GA4 Audit Automation
            </a>
          </div>
        `;
        messages.appendChild(c);
      }, 300);
    }

    sendBtn.addEventListener('click', sendClaude);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendClaude();
      }
    });
  </script>
</body>
</html>
